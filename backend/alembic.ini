# Alembic 配置文件
[alembic]
# 迁移脚本目录
script_location = backend/alembic

# 数据库 URL（运行时由 env.py 动态设置，这里仅占位）
sqlalchemy.url = sqlite:///data/edgeguard.db

# 模板编码
output_encoding = utf-8

# 时区
timezone = Asia/Shanghai

# SQLite 批量模式（支持 ALTER TABLE 等操作）
# 在 env.py 中通过 render_as_batch=True 启用

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
