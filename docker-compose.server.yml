# docker-compose.server.yml — 服务器部署（无摄像头/MediaPipe/Whisper）
# 使用: docker compose -f docker-compose.server.yml up -d --build
version: '3.8'

services:
  # 网易云音乐 API
  music-api:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./tools/netease-cloud-music-api:/app
    command: sh -c "npm install && node app.js"
    ports:
      - "3000:3000"
    restart: unless-stopped

  # 后端：精简镜像（无视觉依赖）
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend-server
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - CAMERA_ENABLED=0
    restart: unless-stopped
    depends_on:
      - music-api

  # 前端：Nginx 静态服务
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8005:80"
    depends_on:
      - backend
    restart: unless-stopped
